<app-navbar></app-navbar>

<main class="admin-page">
  <section class="admin-shell">
    <header class="admin-header">
      <div class="admin-heading">
        <span class="eyebrow">Z-STORE / ADMIN</span>


    <h1>Store management</h1>

    <p>
      Manage your store content, catalog and promotional settings from one
      place.
    </p>
  </div>

  <div class="admin-status">
    <span class="status-dot"></span>
    <span>Admin workspace</span>
  </div>
</header>

<nav
  class="admin-navigation"
  aria-label="Admin sections"
  role="tablist"
>
  <button
    *ngFor="let tab of tabs"
    type="button"
    class="admin-tab"
    [class.active]="activeTab === tab.id"
    [attr.aria-selected]="activeTab === tab.id"
    [attr.aria-controls]="tab.id + '-panel'"
    [id]="tab.id + '-tab'"
    role="tab"
    (click)="selectTab(tab.id)"
  >
    <span class="tab-icon">
      <i [class]="tab.icon"></i>
    </span>

    <span class="tab-copy">
      <strong>{{ tab.label }}</strong>
      <small>{{ tab.description }}</small>
    </span>

    <i class="bi bi-arrow-up-right tab-arrow"></i>
  </button>
</nav>

<section class="admin-content">
  <div
    *ngIf="activeTab === 'dashboard'"
    id="dashboard-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="dashboard-tab"
  >
    <app-admins-control></app-admins-control>
  </div>

  <div
    *ngIf="activeTab === 'coupons'"
    id="coupons-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="coupons-tab"
  >
    <app-coupons></app-coupons>
  </div>

  <div
    *ngIf="activeTab === 'categories'"
    id="categories-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="categories-tab"
  >
    <app-category></app-category>
  </div>

  <div
    *ngIf="activeTab === 'subcategories'"
    id="subcategories-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="subcategories-tab"
  >
    <app-sup-category></app-sup-category>
  </div>

  <div
    *ngIf="activeTab === 'brands'"
    id="brands-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="brands-tab"
  >
    <app-brand></app-brand>
  </div>

  <div
    *ngIf="activeTab === 'products'"
    id="products-panel"
    class="admin-panel"
    role="tabpanel"
    aria-labelledby="products-tab"
  >
    <app-add-product></app-add-product>
  </div>
</section>


  </section>
</main>
