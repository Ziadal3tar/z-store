<nav
  id="nav"
  [ngClass]="onScroll"
  class="site-navbar"
  aria-label="Main navigation"
>
  <div class="container">
    <div class="navbar-shell">

      <!-- Mobile menu -->
      <button
        type="button"
        class="mobile-menu-btn"
        (click)="showNav()"
        aria-label="Open menu"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Logo -->
      <a
        routerLink="/home"
        class="brand-logo"
        aria-label="Z-Store Home"
      >
        <span>Z</span>-STORE
      </a>

      <!-- Desktop Navigation -->
      <div class="desktop-nav">
        <ul class="nav-links">
          <li>
            <a
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              HOME
            </a>
          </li>

          <li>
            <a
              routerLink="/shop"
              routerLinkActive="active"
            >
              SHOP
            </a>
          </li>

          <li>
            <a
              routerLink="/Blog"
              routerLinkActive="active"
            >
              BLOG
            </a>
          </li>

          <li *ngIf="userData?.role == 'Admin'">
            <a
              routerLink="/admin"
              routerLinkActive="active"
            >
              ADMIN
            </a>
          </li>

          <li>
            <a routerLink="/Contact"
            routerLinkActive="active">
              CONTACT
            </a>
          </li>
        </ul>
      </div>

      <!-- Actions -->
      <div class="navbar-actions">

        <!-- Search -->
        <button
          type="button"
          class="icon-btn"
          (click)="openSearch = !openSearch"
          aria-label="Search"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <!-- User -->
        <ng-container *ngIf="userData; else loginLink">

          <a
            routerLink="/userinfo/settings"
            class="user-avatar"
            aria-label="Account settings"
            [style.background-image]="'url(' + (userData.profilePic || 'assets/images/user.png') + ')'"
          >
          </a>

          <!-- Cart -->
          <button
            type="button"
            class="cart-btn"
            (click)="sideCart = 'open'; Subtotal()"
            aria-label="Shopping cart"
          >
            <i class="fa-solid fa-bag-shopping"></i>

            <span
              *ngIf="userData?.cartId?.products?.length"
              class="cart-badge"
            >
             {{ userData.cartId?.products?.length ?? 0 }}
            </span>
          </button>

        </ng-container>

        <!-- Login -->
        <ng-template #loginLink>
          <a
            routerLink="/login"
            class="login-btn"
          >
            SIGN IN
          </a>
        </ng-template>

      </div>

    </div>
  </div>
</nav>

<!-- Search Backdrop -->
<div
  *ngIf="openSearch"
  class="search-backdrop"
  (click)="openSearch = false"
></div>

<!-- Search Panel -->
<div
  *ngIf="openSearch"
  class="search-panel"
>
  <div class="container">
    <div class="search-box">

      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          [(ngModel)]="nameSearch"
          (keyup)="search()"
          type="search"
          placeholder="Search stores..."
          autocomplete="off"
        />

        <button
          type="button"
          class="search-close"
          (click)="openSearch = false"
          aria-label="Close search"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Search Results -->
      <div
        *ngIf="searched?.length"
        class="search-results"
      >

        <a
          *ngFor="let item of searched; let i = index"
          [routerLink]="'/yourStore/' + item._id"
          class="store-search-item"
          [ngClass]="{
            'last-item': i === searched.length - 1
          }"
        >
          <div class="store-search-info">

            <div
              class="store-image"
              [style.background-image]="'url(' + item?.storeImage + ')'"
            ></div>

            <div class="store-content">
              <span class="store-label">
                STORE
              </span>

              <strong>
                {{ item.name }}
              </strong>
            </div>

          </div>

          <div
            *ngIf="userData?.role == 'admin'"
            class="store-delete"
            (click)="$event.preventDefault(); $event.stopPropagation(); removeStore(item._id)"
            title="Remove store"
          >
            <i class="fa-solid fa-ban"></i>
          </div>
        </a>

      </div>

      <!-- Empty Search -->
      <div
        *ngIf="nameSearch && !searched?.length"
        class="search-empty"
      >
        <i class="fa-solid fa-store-slash"></i>

        <h6>No stores found</h6>

        <p>
          Try searching with another name.
        </p>
      </div>

    </div>
  </div>
</div>

<!-- Cart -->
<app-cart-on-all
  [sideCart]="sideCart"
  [subtotal]="subtotal"
  [userData]="userData"
  (getlength)="cartlength = $event"
  (closeCart)="sideCart = $event"
>
</app-cart-on-all>

<!-- Responsive Navigation -->
<app-res-nav
  [sideNav]="sideNav"
  (backNav)="sideNav = $event"
>
</app-res-nav>
